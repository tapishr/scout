[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-jobs"
version = "0.1.0"
description = "Finds India-eligible remote senior engineering roles from public job APIs and reports only what is new since the last run."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tapish Rathore" }]
keywords = ["jobs", "remote-work", "job-search", "india", "ashby", "greenhouse"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
scout = "scout.cli:main"

[project.urls]
Homepage = "https://github.com/tapishr/scout"
Issues = "https://github.com/tapishr/scout/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# So `pytest` works in a bare checkout without an editable install.
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scout", "conftest"]
